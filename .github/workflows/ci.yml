name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bend_target: darwin-arm64
            bend_sha256: c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31
            llvm_asset: LLVM-21.1.8-macOS-ARM64.tar.xz
            llvm_sha256: b95bdd32a33a81ee4d40363aaeb26728a26783fcef26a4d80f65457433ea4669
          - os: ubuntu-24.04
            bend_target: linux-x64
            bend_sha256: 91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4
            llvm_asset: LLVM-21.1.8-Linux-X64.tar.xz
            llvm_sha256: b3b7f2801d15d50736acea3c73982994d025b01c2f035b91ae3b49d1b575732b

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '28.1'
          elixir-version: '1.20.3'
          version-type: strict

      - name: Install pinned LLVM clang 21.1.8
        env:
          LLVM_ASSET: ${{ matrix.llvm_asset }}
          LLVM_SHA256: ${{ matrix.llvm_sha256 }}
        run: scripts/ci/install_clang.sh

      - name: Install pinned Bend 2.0.25
        env:
          BEND_TARGET: ${{ matrix.bend_target }}
          BEND_SHA256: ${{ matrix.bend_sha256 }}
        run: scripts/ci/install_bend.sh

      - name: Verify toolchain
        run: |
          clang --version
          bend version
          elixir --version

      - name: Install locked dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test --warnings-as-errors

      - name: Strict Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer

      - name: Documentation
        run: mix docs --warnings-as-errors

      - name: AddressSanitizer port check
        env:
          MIX_ENV: test
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:handle_segv=2
        run: |
          mix run demos/csv/check_asan.exs
          mix run demos/csv/check_stream_asan.exs
          mix run demos/csv/check_ask_asan.exs

      - name: Sustained overload and RSS observation
        env:
          MIX_ENV: test
        run: mix run scripts/check_overload.exs

      - name: Port cancellation and large-frame transport stress
        env:
          MIX_ENV: test
        run: mix run scripts/check_port_transport.exs

      - name: Compiler-free consumer release
        run: sh test/release_smoke.sh

      - name: Actual Hex package in a fresh consumer
        run: sh test/package_smoke.sh

      - name: Experimental NIF lifecycle in isolated VMs
        env:
          MIX_ENV: test
        run: |
          mix run scripts/check_nif_lifecycle.exs
          mix run scripts/check_nif_init.exs
          mix run scripts/check_nif_scheduler.exs
